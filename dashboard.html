<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ScriptAI</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <div class="sidebar">

            <h2>ScriptAI 🚀</h2>

            <ul>
                <li>Dashboard</li>
                <li>Analyze Script</li>
                <li>Analytics</li>
                <li>History</li>
                <li>Profile</li>
            </ul>

        </div>

        <!-- Main Content -->

        <div class="main-content">

            <!-- Navbar -->

            <div class="topbar">

                <h1>Dashboard</h1>

                <button>Logout</button>

            </div>

            <!-- Cards -->

            <div class="cards">

                <div class="card">
                    <h3>Total Scripts</h3>
                    <p>24</p>
                </div>

                <div class="card">
                    <h3>Retention Score</h3>
                    <p>89%</p>
                </div>

                <div class="card">
                    <h3>Viral Prediction</h3>
                    <p>High 🚀</p>
                </div>

            </div>

            <!-- Script Analyzer -->

            <div class="analyzer">

                <h2>Analyze New Script</h2>

                <textarea placeholder="Paste your video script here..."></textarea>

                <button onclick="analyzeScript()">
    Analyze Script
</button>

<!-- Result Section -->

<div class="result-box" id="resultBox">

    <h2>Analysis Result</h2>

    <div class="result-card">

        <p><strong>Retention Score:</strong>
            <span id="score">0%</span>
        </p>

        <p><strong>Viral Prediction:</strong>
            <span id="prediction">-</span>
        </p>

        <p><strong>AI Suggestion:</strong>
            <span id="suggestion">-</span>
        </p>

    </div>

</div>

<script src="js/analyze.js"></script>

            </div>

        </div>

    </div>

</body>
</html>
