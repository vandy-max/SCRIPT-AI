<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - ScriptAI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-box signup-box">

            <h1>Create Account 🚀</h1>

            <p>Start analyzing scripts with AI</p>

            <form id="signupForm">

                <input type="text" placeholder="Enter Username">

                <input type="email" placeholder="Enter Email">

                <input type="password" placeholder="Enter Password">

                <select>
                    <option>Select Creator Type</option>
                    <option>YouTuber</option>
                    <option>Instagram Creator</option>
                    <option>TikTok Creator</option>
                    <option>Podcaster</option>
                </select>

                <textarea placeholder="Describe Your Content Vision"></textarea>

                <button type="submit">
                    Create Account
                </button>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

</body>
</html>
